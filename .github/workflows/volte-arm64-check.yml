name: VoLTE ARM64 Check

on:
  push:
    branches:
      - feat/volte-beta9-port
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libqmi-dev libqrtr-glib-dev libglib2.0-dev

      - name: Build backend for ARM64
        working-directory: backend
        env:
          SQLITE3_STATIC: '1'
          LIBSQLITE3_SYS_USE_PKG_CONFIG: '0'
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --locked --release --target aarch64-unknown-linux-musl

      - name: Build beta9-compatible UIM helper
        run: |
          gcc -O2 -o simadmin-uim-apdu scripts/simadmin-uim-apdu.c $(pkg-config --cflags --libs libqmi-glib)

      - name: Upload ARM64 backend
        uses: actions/upload-artifact@v4
        with:
          name: simadmin-volte-aarch64
          path: |
            backend/target/aarch64-unknown-linux-musl/release/simadmin
            simadmin-uim-apdu
          if-no-files-found: error
